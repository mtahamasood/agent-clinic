name: CI

# Every quality gate in specs/tech-stack.md, run on a machine that starts
# empty. The clean-clone claim in the phase spec cannot be verified on the
# machine that wrote the code — this is the only place it gets tested.
on:
  # Unqualified `push` plus `pull_request` ran the whole suite twice for every
  # commit on a branch with an open PR — 16 of 42 runs were redundant. `main` is
  # pull-request only (see specs/tech-stack.md, "Branch protection"), so a PR
  # build covers every change before it lands and this push build is the
  # post-merge check on the merge result.
  #
  # Cost accepted: a branch pushed with no PR open gets no CI. Open the PR as a
  # draft to get it back.
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # GitHub's default job limit is 6 hours. A suite that finishes in about two
    # minutes does not need six hours to decide it has failed: on 2026-08-19 a
    # post-merge build sat on `playwright install --with-deps` for nine minutes
    # with nothing wrong in the commit, and would have sat there until lunch.
    # Ten minutes is roughly twice the slowest honest run on record (4m04s), so
    # a normal build never sees it and a hung one fails while it still reads as
    # news. Set on the job rather than per step, because the next thing to hang
    # will not be the step that hung last time.
    timeout-minutes: 10

    env:
      # The self-hosted target: a libSQL file on disk. The Vercel target differs
      # only in this value — see specs/tech-stack.md, "Parity rules".
      DATABASE_URL: file:./clinic.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          # check:changelog needs a merge base with the target branch. A shallow
          # clone cannot provide one, and that check fails loudly rather than
          # passing blind — so the history has to actually be here.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Runs `prisma generate` via postinstall.
      - run: npm ci

      - name: Provision the database
        run: |
          npm run migrate
          npm run seed

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Every decision record must name its source — see specs/tech-stack.md,
      # "Requirement provenance". Runs inside `verify` so branch protection
      # makes it binding: an unattributed requirement cannot reach main.
      - run: npm run check:provenance
      - run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds and starts the app itself, per playwright.config.ts (D3).
      - run: npm run test:e2e

      # Last on purpose. A missing changelog entry is the cheapest failure here
      # to fix and the least urgent to learn about, so it runs after everything
      # that could tell you something you did not already know — a failing step
      # skips the rest of the job, and a missing entry must never mask a broken
      # test. Still inside `verify`, so branch protection keeps it binding.
      #
      # On a push build the script skips itself: HEAD is main, and the entry
      # arrived with the merge.
      - run: npm run check:changelog

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
