name: CI

# Every quality gate in specs/tech-stack.md, run on a machine that starts
# empty. The clean-clone claim in the phase spec cannot be verified on the
# machine that wrote the code — this is the only place it gets tested.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The self-hosted target: a libSQL file on disk. The Vercel target differs
      # only in this value — see specs/tech-stack.md, "Parity rules".
      DATABASE_URL: file:./clinic.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          # check:changelog needs a merge base with the target branch. A shallow
          # clone cannot provide one, and that check fails loudly rather than
          # passing blind — so the history has to actually be here.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Runs `prisma generate` via postinstall.
      - run: npm ci

      - name: Provision the database
        run: |
          npm run migrate
          npm run seed

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Every decision record must name its source — see specs/tech-stack.md,
      # "Requirement provenance". Runs inside `verify` so branch protection
      # makes it binding: an unattributed requirement cannot reach main.
      - run: npm run check:provenance
      # A branch that changed the product or the constitution also updates
      # CHANGELOG.md — see specs/tech-stack.md, "Changelog". Inside `verify`, so
      # branch protection makes it binding.
      - run: npm run check:changelog
      - run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds and starts the app itself, per playwright.config.ts (D3).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
